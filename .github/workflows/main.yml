name: Auto Unzip
on:
  push:
    paths:
      - '**.zip'

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Скачать файлы
        uses: actions/checkout@v4
      - name: Распаковать ZIP
        run: |
          find . -name "*.zip" -type f -print0 | while IFS= read -r -d '' file; do
            unzip -o "$file"
            rm "$file"
          done
      - name: Отправить распакованные файлы обратно
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Автоматическая распаковка ZIP" || echo "Нет изменений"
          git push
